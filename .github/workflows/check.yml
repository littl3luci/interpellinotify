name: check
on:
  schedule:
    - cron: '*/10 4-19 * * *'  # UTC: 06:00-21:30 ora legale, 05:00-20:30 ora solare
  workflow_dispatch:
concurrency: check  # mai due run insieme (schedule + dispatch)
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 interpelli.py
        env:
          NTFY: ${{ secrets.NTFY }}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add interpelli.seen.json && git diff --cached --quiet || git commit -m "seen" && git pull --rebase && git push
