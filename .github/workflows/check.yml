name: check
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 interpelli.py
        env:
          NTFY: ${{ secrets.NTFY }}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add interpelli.seen.json && git diff --cached --quiet || git commit -m "seen" && git push
