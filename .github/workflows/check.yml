name: check
on:
  schedule:
    # ogni 40 min, ore 4-19 UTC (06:00-21:20 ora legale, 05:00-20:20 solare); due righe perche' */40 in cron non attraversa l'ora
    - cron: '0,40 4,6,8,10,12,14,16,18 * * *'
    - cron: '20 5,7,9,11,13,15,17,19 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 interpelli.py
        env:
          NTFY: ${{ secrets.NTFY }}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add interpelli.seen.json && git diff --cached --quiet || git commit -m "seen" && git pull --rebase && git push
